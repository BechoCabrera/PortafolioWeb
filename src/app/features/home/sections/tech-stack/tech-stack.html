<section id="stack" class="tech-stack section-space">
  <div class="shell tech-stack__layout">
    <div class="section-heading tech-stack__heading">
      <span class="section-heading__number">03</span>
      <p class="eyebrow">{{ t("section.stackEyebrow") }}</p>
      <h2>{{ t("section.stack") }}</h2>
    </div>

    <div class="tech-stack__groups">
      @for (group of technologyGroups; track group.id; let index = $index) {
        <app-technology-group [group]="group" [index]="index + 1" />
      }
    </div>
  </div>
</section>
